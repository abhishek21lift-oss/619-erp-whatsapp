name: Deploy WhatsApp Gateway to VPS

on:
  push:
    branches:
      - feature/whatsapp-gateway-mvp
  workflow_dispatch:

concurrency:
  group: deploy-vps-whatsapp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gateway to MY PT STUDIO VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd /opt/myptstudio

            if [ ! -d /opt/myptstudio/619-erp-whatsapp/.git ]; then
              git clone https://github.com/abhishek21lift-oss/619-erp-whatsapp.git /opt/myptstudio/619-erp-whatsapp
            fi

            cd /opt/myptstudio/619-erp-whatsapp
            git fetch origin feature/whatsapp-gateway-mvp
            git checkout feature/whatsapp-gateway-mvp
            git reset --hard origin/feature/whatsapp-gateway-mvp

            cd /opt/myptstudio
            docker compose config --services | grep -qx 'redis'
            docker compose config --services | grep -qx 'backend'

            WA_NETWORK_NAME="$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' myptstudio-redis | head -n 1)"
            [ -n "$WA_NETWORK_NAME" ]
            if ! docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' myptstudio-backend | grep -Fxq "$WA_NETWORK_NAME"; then
              echo "Redis and backend are not sharing the resolved network: $WA_NETWORK_NAME"
              exit 1
            fi
            export WA_NETWORK_NAME
            echo "Using existing ERP Docker network: $WA_NETWORK_NAME"

            touch /opt/myptstudio/.env
            chmod 600 /opt/myptstudio/.env
            if ! grep -q '^WA_GATEWAY_KEY=' /opt/myptstudio/.env; then
              printf '\nWA_GATEWAY_KEY=%s\n' "$(openssl rand -hex 32)" >> /opt/myptstudio/.env
            fi
            if ! grep -q '^WA_WEBHOOK_SECRET=' /opt/myptstudio/.env; then
              printf 'WA_WEBHOOK_SECRET=%s\n' "$(openssl rand -hex 32)" >> /opt/myptstudio/.env
            fi
            if ! grep -q '^WA_BACKEND_URL=' /opt/myptstudio/.env; then
              printf 'WA_BACKEND_URL=http://myptstudio-backend:5000\n' >> /opt/myptstudio/.env
            fi
            if ! grep -q '^WA_CONNECTOR=' /opt/myptstudio/.env; then
              printf 'WA_CONNECTOR=baileys\n' >> /opt/myptstudio/.env
            fi

            docker compose -f /opt/myptstudio/docker-compose.yml -f /opt/myptstudio/619-erp-whatsapp/deploy/compose.whatsapp.yml config >/dev/null
            docker compose -f /opt/myptstudio/docker-compose.yml -f /opt/myptstudio/619-erp-whatsapp/deploy/compose.whatsapp.yml build whatsapp
            docker compose -f /opt/myptstudio/docker-compose.yml -f /opt/myptstudio/619-erp-whatsapp/deploy/compose.whatsapp.yml up -d whatsapp

            # Compose merges the base service network map, so explicitly enforce
            # the existing ERP network on the created container before health checks.
            docker network connect "$WA_NETWORK_NAME" myptstudio-whatsapp 2>/dev/null || true
            docker network disconnect ai-gateway myptstudio-whatsapp 2>/dev/null || true
            docker restart myptstudio-whatsapp

            echo "Waiting for myptstudio-whatsapp to become healthy..."
            for i in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' myptstudio-whatsapp 2>/dev/null || true)"
              echo "health[$i/60]: $status"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "no-healthcheck" ]; then
                echo "Gateway failed health validation"
                docker logs --tail 100 myptstudio-whatsapp || true
                exit 1
              fi
              sleep 1
            done

            final_status="$(docker inspect --format '{{.State.Health.Status}}' myptstudio-whatsapp)"
            [ "$final_status" = "healthy" ] || {
              echo "Gateway did not become healthy within 60s"
              docker logs --tail 100 myptstudio-whatsapp || true
              exit 1
            }

            echo "Docker network attachments:"
            docker inspect --format '{{json .NetworkSettings.Networks}}' myptstudio-whatsapp
            echo "Published ports:"
            docker inspect --format '{{json .NetworkSettings.Ports}}' myptstudio-whatsapp
            docker compose -f /opt/myptstudio/docker-compose.yml -f /opt/myptstudio/619-erp-whatsapp/deploy/compose.whatsapp.yml ps whatsapp
            docker exec myptstudio-whatsapp node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(console.log)"

            printf '%s\n' '${{ github.sha }}' > /opt/myptstudio/.whatsapp-deployed-sha
