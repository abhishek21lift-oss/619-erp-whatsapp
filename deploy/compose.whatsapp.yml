# WhatsApp gateway overlay for the production MY PT STUDIO Compose stack.
# The gateway must share the existing ERP Docker network with backend and Redis.

services:
  whatsapp:
    container_name: myptstudio-whatsapp
    build:
      context: ./619-erp-whatsapp
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      LOG_LEVEL: ${WA_LOG_LEVEL:-info}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY:?set it in /opt/myptstudio/.env}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:?set it in /opt/myptstudio/.env}
      WA_BACKEND_URL: ${WA_BACKEND_URL:-http://myptstudio-backend:5000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WA_SESSION_DIR: /data/sessions
      WA_MANIFEST_PATH: /data/instances.json
      WA_QUARANTINE_DIR: /data/quarantine
      WA_MAX_INSTANCES: ${WA_MAX_INSTANCES:-50}
      WA_QR_TTL_SEC: ${WA_QR_TTL_SEC:-60}
      WA_QR_MAX_ROUNDS: ${WA_QR_MAX_ROUNDS:-5}
      WA_CONNECT_TIMEOUT_MS: ${WA_CONNECT_TIMEOUT_MS:-45000}
      WA_CONNECTOR: ${WA_CONNECTOR:-baileys}

    volumes:
      - whatsapp-sessions:/data

    # Attach explicitly to the same external Docker network as the existing
    # backend/Redis services. WA_NETWORK_NAME is resolved by the deployment
    # workflow from the already-running backend container, so we never guess
    # or rename the production network.
    networks:
      myptstudio_network:
        aliases:
          - myptstudio-whatsapp

    depends_on:
      redis:
        condition: service_started

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    mem_limit: ${WA_MEM_LIMIT:-1g}

networks:
  myptstudio_network:
    external: true
    name: ${WA_NETWORK_NAME:?deployment must set WA_NETWORK_NAME to the existing ERP Docker network}

volumes:
  whatsapp-sessions:
